<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Background with subtle rounded corners -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.8"/>
  
  <!-- Subtle inner ambient circle -->
  <circle cx="256" cy="330" r="180" fill="#10b981" fill-opacity="0.04" />

  <!-- Wi-Fi Waves -->
  <g filter="url(#glow)">
    <!-- Outer Arc -->
    <path d="M 80 185 A 248 248 0 0 1 432 185" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Middle Arc -->
    <path d="M 136 242 A 172 172 0 0 1 376 242" fill="none" stroke="url(#accentGrad)" stroke-width="30" stroke-linecap="round"/>
    
    <!-- Inner Arc -->
    <path d="M 194 298 A 94 94 0 0 1 318 298" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Center Dot -->
    <circle cx="256" cy="360" r="32" fill="url(#accentGrad)"/>
  </g>
</svg>
